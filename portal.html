<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarginMatrix AI | Partner Gate</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-input: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --tech-cyan: #0284c7;
            --border-clean: 1px solid #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: var(--bg-surface);
            border: var(--border-clean);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            text-align: center;
        }
        h2 { font-size: 1.8rem; margin: 0 0 6px 0; font-weight: 800; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px; font-weight: 500; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
        input {
            width: 100%; padding: 12px 14px; background-color: var(--bg-input); border: var(--border-clean); border-radius: 8px; color: var(--text-main); font-size: 0.9rem; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #1d4ed8); color: #ffffff; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }
        .toggle-link { display: block; margin-top: 20px; font-size: 0.8rem; color: var(--tech-cyan); text-decoration: none; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card" id="auth_screen">
        <h2>🔒 <span id="auth_title">Partner Login</span></h2>
        <div class="subtitle" id="auth_subtitle">Enter your corporate credentials to access Runway AI</div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="auth_email" placeholder="name@company.com">
        </div>

        <div class="form-group">
            <label>Account Password</label>
            <input type="password" id="auth_password" placeholder="••••••••">
        </div>

        <button onclick="event.preventDefault(); handleAuth()" id="auth_btn">Secure Sign In</button>
        <a class="toggle-link" onclick="toggleAuthMode()" id="auth_toggle_text">Need to register a corporate account? Create one here</a>
    </div>
    <script>
        var isLoginMode = true;
        var supabaseUrl = "https://zhtpvafqukwvzhuanjos.supabase.co";
        var supabaseKey = "sb_publishable_hOQt6LUZNXlPjxzTagl5w_jh0PzoK1h_SgScl7Dsmq33R2AonW-wQ6_VzO7Lg3qZl68";
        var supabaseClient = supabase.createClient(supabaseUrl, supabaseKey, {
            auth: { 
                persistSession: true,
                   autoRefreshToken: true,
                  detectSessionInUrl: false
                  }
        });

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("auth_title").innerText = isLoginMode ? "Partner Login" : "Create Account";
            document.getElementById("auth_subtitle").innerText = isLoginMode ? "Enter your corporate credentials to access Runway AI" : "Register your email to stand up a secure session layout";
            document.getElementById("auth_btn").innerText = isLoginMode ? "Secure Sign In" : "Register Corporate Account";
            document.getElementById("auth_toggle_text").innerText = isLoginMode ? "Need to register a corporate account? Create one here" : "Already have a platform account? Log in here";
        }

        function handleAuth() {
            var email = document.getElementById("auth_email").value.trim();
            var password = document.getElementById("auth_password").value;

            if(!email || !password) {
                alert("Please fully complete your account credentials!");
                return;
            }

            if (isLoginMode) {
                supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function(result) {
                    if (result.error) {
                        alert("Authentication Error: " + result.error.message);
                    } else {
                        launchDashboard();
                    }
                });
            } else {
                supabaseClient.auth.signUp({ email: email, password: password }).then(function(result) {
                    if (result.error) {
                        alert("Registration Blocked: " + result.error.message);
                    } else {
                        alert("Registration Successful! Logging you in automatically...");
                        launchDashboard();
                    }
                });
            }
        }

        function launchDashboard() {
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
