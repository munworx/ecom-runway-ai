<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MunWorx AI Dashboard</title>
    <!-- Supabase CDN Link -->
   <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .dashboard-container { max-width: 900px; width: 100%; display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        .sidebar { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; height: fit-content; }
        .main-content { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .text-input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; color: #fff; }
        .btn-blue { background-color: #2563eb; }
        .btn-red { background-color: #dc2626; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .vault-header-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Sidebar Panel Layout -->
    <div class="sidebar">
        <h3>MarginMatrix AI</h3>
        <p style="color: green;">● Supabase Cloud Active</p>
        <button class="btn btn-blue" onclick="generatePDFReport()">Export Board Report (PDF)</button>
        <button class="btn btn-red" onclick="logoutSession()">Secure Log Out</button>
    </div>

    <!-- Main Workspace Dashboard Form Content -->
    <div class="main-content">
        <h3>✦ INTELLIGENT COMPETITOR AUTO-DISCOVERY</h3>
        <input type="text" class="text-input" placeholder="Type retail product name, brand, or barcode...">
        
        <div class="vault-header-grid" style="margin-top: 20px;">
            <h3>☁ CLOUD SAVED PRODUCTS VAULT</h3>
            <!-- 🌟 FIXED DROPDOWN ID NAME SELECTION -->
            <select id="vault-list" class="text-input" onchange="loadSelectedVault(this.value)">
                <option value="">- View Saved Vault Profiles -</option>
            </select>
        </div>

        <label>Give this tracking setup a client name:</label>
        <input type="text" id="client_name_input" class="text-input" placeholder="Enter custom profile label name...">

        <h3>🔗 MY OWN STORE LISTING LINK (YOUR PRODUCT)</h3>
        <input type="text" id="my_url" class="text-input" value="https://amazon.com.au">

        <h3>🔥 MULTI-SCRAPER COMPETITOR TARGET LINKS</h3>
        <input type="text" id="target_url" class="text-input" value="https://ebay.com.au">

        <div class="grid-3">
            <div>
                <label>ITEM SOURCING COST ($)</label>
                <input type="number" id="item_cost" class="text-input" value="25">
            </div>
            <div>
                <label>SOFTWARE OVERHEAD ($)</label>
                <input type="number" id="overhead" class="text-input" value="150">
            </div>
            <div>
                <label>CASH TAKE-HOME TARGET ($)</label>
                <input type="number" id="net_target" class="text-input" value="2500">
            </div>
        </div>

        <button class="btn btn-blue" style="margin-top: 20px;" onclick="saveProfileToCloud()">💾 Save Profile To Cloud Vault</button>
    </div>
</div>

<script>
// 🌟 SECTION 2: LIVE CONNECTIONS & DATA READING

const supabaseUrl = "https://zhtpvafqukwvzhanujos.supabase.co"
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInN1YiI6InpodHB2YWZxdWt2emhhbnVqb3MiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcyNzY1NDA2NSwiZXhwIjoyMDQzMjEwMDY1fQ.xuC33xL6vaefvuJ9myzi30sPDfjAoiS0tKlYz2LjqR4";

// Clean client initialization block structure
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
let savedVaultProfiles = [];

// 1. DATABASE FETCH: Load your custom data records seamlessly
async function fetchVaultProfiles() {
    try {
        console.log("Reaching out to Supabase table: product_vault...");
        const { data, error } = await supabaseClient
            .from('product_vault')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        savedVaultProfiles = data || [];
        const dropdown = document.getElementById('vault-list');
        
        // Reset dropdown contents completely
        dropdown.innerHTML = '<option value="">- View Saved Vault Profiles -</option>';

        if (savedVaultProfiles.length === 0) {
            console.log("Successfully connected, but no records exist in 'product_vault' table yet.");
            return;
        }

        // Add each data record row into our dropdown menu element
        savedVaultProfiles.forEach(profile => {
            const opt = document.createElement('option');
            opt.value = profile.id;
            opt.innerText = profile.profile_name || "Unnamed Profile";
            dropdown.appendChild(opt);
        });

        console.log("Successfully rendered profiles into your dropdown list!");
    } catch (err) {
        console.error("Database read warning:", err.message);
    }
}

// 2. DATABASE WRITE: Save structural field inputs back down to cloud storage
async function saveProfileToCloud() {
    try {
        const clientLabel = document.getElementById('client_name_input').value.trim();
        if (!clientLabel) {
            alert("Please type a client name before saving!");
            return;
        }

        const profilePayload = {
            profile_name: clientLabel,
            my_url: document.getElementById('my_url').value,
            target_url: document.getElementById('target_url').value,
            item_cost: parseFloat(document.getElementById('item_cost').value) || 0,
            overhead_num: parseFloat(document.getElementById('overhead').value) || 0,
            net_target: parseFloat(document.getElementById('net_target').value) || 0
        };

        const { data, error } = await supabaseClient
            .from('product_vault')
            .insert([profilePayload]);

        if (error) throw error;

        alert("Success! Profile saved to cloud vault.");
        document.getElementById('client_name_input').value = '';
        fetchVaultProfiles(); // Refresh the list instantly
    } catch (err) {
        alert("Error saving layout: " + err.message);
    }
}
// 🌟 SECTION 3: DROP SELECTION & PAGE FINISHERS
function loadSelectedVault(selectedId) {
    if (!selectedId) return;
    
    const profile = savedVaultProfiles.find(p => p.id == selectedId);
    if (profile) {
        document.getElementById('client_name_input').value = profile.profile_name || '';
        document.getElementById('my_url').value = profile.my_url || '';
        document.getElementById('target_url').value = profile.target_url || '';
        document.getElementById('item_cost').value = profile.item_cost || '';
        document.getElementById('overhead').value = profile.overhead_num || '';
        document.getElementById('net_target').value = profile.net_target || '';
    }
}

function generatePDFReport() {
    window.print();
}

function navigatePortal(targetUrl) {
    if (targetUrl) {
        window.location.href = targetUrl;
    }
}

function logoutSession() {
    alert("Logging out securely...");
}

// THE STARTUP FIX: Safely executes your fetch query right after layout paints
window.addEventListener('DOMContentLoaded', () => {
    fetchVaultProfiles();
});
</script>
</body>
</html>
